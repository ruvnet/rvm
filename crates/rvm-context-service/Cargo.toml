[package]
name = "rvm-context-service"
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Durable encrypted RuVector-backed ruv context service"
keywords = ["context", "ruvector", "redb", "encryption"]
categories = ["database", "cryptography"]

[dependencies]
rvm-context = { workspace = true, features = ["std"] }
rvm-proof = { workspace = true, features = ["std"] }
rvm-rvf = { workspace = true }
rvm-types = { workspace = true }
rvm-witness = { workspace = true }
ruvector-context = { path = "../../ruvector/crates/ruvector-context" }
ruvector-core = { path = "../../ruvector/crates/ruvector-core", default-features = false, features = ["storage", "hnsw"] }
aes-gcm = "=0.10.3"
base64 = "=0.22.1"
bytes = { version = "=1.12.1", optional = true }
getrandom = "=0.2.16"
http-body-util = { version = "=0.1.3", optional = true }
hyper = { version = "=1.9.0", features = ["http1", "server"], optional = true }
hyper-util = { version = "=0.1.20", features = ["tokio"], optional = true }
redb = "=2.6.3"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"], optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = { workspace = true, features = ["std"] }
tokio = { version = "=1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"], optional = true }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"], optional = true }
zeroize = { version = "=1.8.1", features = ["zeroize_derive"] }

[dev-dependencies]
tempfile = "=3.27.0"

[features]
default = []
gateway-bin = [
    "dep:bytes",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:rustls",
    "dep:tokio",
    "dep:tokio-rustls",
]

[[bin]]
name = "rvm-context-server"
path = "src/bin/server.rs"
required-features = ["gateway-bin"]

[[bin]]
name = "rvm-context-cli"
path = "src/bin/cli.rs"
required-features = ["gateway-bin"]
