[package]
name = "rvm-rvf"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://ruv.io"
description = "RVF execution contract for RVM: verify-before-load, capability mapping, witnessed results (ADR-284, ADR-286)"
keywords = ["rvf", "hypervisor", "capability", "no_std", "verification"]
categories = ["no-std", "embedded", "os"]

[lib]
crate-type = ["rlib"]

[dependencies]
rvm-types = { workspace = true }
rvm-cap = { workspace = true }
rvm-witness = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
subtle = { workspace = true }
xxhash-rust = { workspace = true }
ed25519-dalek = { version = "=2.1.1", default-features = false }

[dev-dependencies]
serde_json = "1"
peak_alloc = "0.2"
proptest = { workspace = true }
# The streaming tests build descriptors with the producer-side helpers.
rvm-rvf = { path = ".", features = ["testkit"] }

[features]
default = []
# Producer-side helpers (descriptor builder, synthetic containers) for tests and
# benches in downstream crates. Never enabled in a production dependency graph.
testkit = []
# Overlap the identity SHA-256 with the leaf SHA-256 on a worker thread.
# Same digest, same verdicts; needs `std`. Off by default; `no_std` unaffected.
parallel-identity = ["std"]
std = [
    "rvm-types/std",
    "rvm-cap/std",
    "rvm-witness/std",
    "sha2/std",
    "sha3/std",
    "subtle/std",
    "ed25519-dalek/std",
]
