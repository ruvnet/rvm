[package]
name = "rvm-host-ios"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Signer-bound HostedIOS policy, receipts, and WASM host bridge for RVM"
keywords = ["ios", "wasm", "sandbox", "capability", "edge"]
categories = ["virtualization", "os"]

[dependencies]
rvm-host = { workspace = true, features = ["std"] }
rvm-rvf = { workspace = true, features = ["std"] }
rvm-wasm-hosted = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true, features = ["std"] }
zeroize = { workspace = true }

[dev-dependencies]
rvm-rvf = { workspace = true, features = ["std", "testkit"] }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std"] }
wat = "=1.219.2"
