[package]
name = "rvm-launch"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://ruv.io"
description = "Instance lifecycle for verified RVF agents: create, start, suspend, resume, checkpoint, terminate (ADR-289, ADR-288)"
keywords = ["hypervisor", "lifecycle", "checkpoint", "no_std", "rvf"]
categories = ["no-std", "embedded", "os"]

[lib]
crate-type = ["rlib"]

[dependencies]
rvm-types = { workspace = true }
rvm-witness = { workspace = true }
rvm-wasm = { workspace = true, features = ["alloc"] }
rvm-cap = { workspace = true }
rvm-rvf = { workspace = true }
rvm-host = { workspace = true }
rvm-context = { workspace = true }

[dev-dependencies]
rvm-host = { workspace = true, features = ["testkit"] }
rvm-rvf = { workspace = true, features = ["testkit"] }
wat = "=1.243.0"
peak_alloc = "0.2"
proptest = { workspace = true }

[features]
default = []
std = [
    "rvm-types/std",
    "rvm-witness/std",
    "rvm-wasm/std",
    "rvm-cap/std",
    "rvm-rvf/std",
    "rvm-host/std",
    "rvm-context/std",
]
